spring:
  application:
    name: intereses-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.2
  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always
