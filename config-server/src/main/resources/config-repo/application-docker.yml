# Perfil "docker": sobreescribe los valores "localhost" de application.yml con los nombres de
# servicio de la red de docker-compose. Se activa con SPRING_PROFILES_ACTIVE=docker.
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

spring:
  kafka:
    bootstrap-servers: kafka:29092
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8081/oauth2/jwks
